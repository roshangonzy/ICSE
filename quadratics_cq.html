<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic League - Classic Quiz</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-in forwards; }
        
        .delay-100 { animation-delay: 100ms; }
        
        /* Quiz Option States */
        .option-btn { transition: all 0.2s ease; }
        .option-btn:hover { transform: translateY(-2px); border-color: #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .option-btn:active { transform: translateY(0); }
        
        /* Neutral selection color (No instant feedback) */
        .option-selected { background-color: #f1f5f9 !important; border-color: #334155 !important; color: #0f172a !important; font-weight: 600; }
        .option-selected span { background-color: #334155 !important; color: #ffffff !important; }
        
        .timer-warning { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Warning/Exit -->
                <button onclick="confirmExit()" class="flex items-center text-slate-500 hover:text-red-600 font-semibold transition-colors group">
                    <div class="bg-slate-100 group-hover:bg-red-100 p-2 rounded-lg mr-3 transition-colors">
                        <i class="ph-bold ph-x text-lg"></i>
                    </div>
                    Exit Exam
                </button>
                
                <!-- Sticky Timer -->
                <div class="flex items-center bg-slate-900 text-white px-4 py-2 rounded-xl shadow-md border border-slate-700">
                    <i class="ph-bold ph-timer mr-2 text-lg text-red-400"></i>
                    <span id="timer-display" class="font-mono font-bold tracking-widest text-lg">15:00</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <!-- Header -->
        <header class="mb-8 animate-slide-up" id="quiz-header">
            <div class="flex items-center mb-4">
                <span class="bg-red-100 text-red-700 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-widest mr-3">Summative</span>
                <span class="text-slate-400 text-sm font-medium"><i class="ph-fill ph-exam mr-1"></i> Classic Quiz</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">Quadratic Equations</h1>
            <p class="text-slate-500 font-medium mt-3">High-stakes simulation. No instant feedback. Manage your time carefully.</p>
        </header>

        <!-- Quiz Container -->
        <div id="quiz-container" class="bg-white rounded-3xl border border-slate-200 shadow-lg overflow-hidden animate-slide-up delay-100 relative">
            
            <!-- Progress Map -->
            <div class="bg-slate-50 border-b border-slate-200 p-4 overflow-x-auto flex gap-2 justify-center" id="progress-map">
                <!-- Dots injected via JS -->
            </div>

            <!-- Question Area -->
            <div class="p-6 md:p-10">
                <div class="flex justify-between items-start mb-6">
                    <span class="text-sm font-extrabold text-slate-400 uppercase tracking-widest" id="question-tracker">Question 1 of 5</span>
                    <span class="text-sm font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-lg">[1 Mark]</span>
                </div>
                
                <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed mb-8">
                    Loading question...
                </h2>

                <!-- Options -->
                <div id="options-container" class="space-y-4 mb-10">
                    <!-- Options injected via JS -->
                </div>

                <!-- Navigation Controls -->
                <div class="flex items-center justify-between pt-6 border-t border-slate-100">
                    <button id="prev-btn" onclick="prevQuestion()" class="text-slate-500 hover:text-slate-800 font-bold py-3 px-5 rounded-xl transition-colors flex items-center invisible">
                        <i class="ph-bold ph-arrow-left mr-2"></i> Previous
                    </button>
                    
                    <button id="next-btn" onclick="nextQuestion()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-colors flex items-center">
                        Next Question <i class="ph-bold ph-arrow-right ml-2"></i>
                    </button>

                    <button id="submit-btn" onclick="submitExam()" class="hidden bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-xl shadow-md shadow-red-200 transition-colors items-center">
                        Submit Exam <i class="ph-bold ph-check-circle ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Container (Hidden initially) -->
        <div id="results-container" class="hidden animate-slide-up text-center">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden p-10 max-w-2xl mx-auto">
                <div class="inline-flex items-center justify-center h-24 w-24 rounded-full bg-slate-50 border-4 border-slate-100 mb-6 text-slate-800 text-5xl">
                    <i class="ph-fill ph-chart-bar"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Exam Submitted</h2>
                <p class="text-slate-500 font-medium mb-10">Here is your performance breakdown.</p>
                
                <div class="grid grid-cols-2 gap-4 mb-10">
                    <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Final Score</p>
                        <p class="text-4xl font-extrabold text-slate-800" id="final-score-text">0/5</p>
                    </div>
                    <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Time Taken</p>
                        <p class="text-3xl font-extrabold text-slate-800 mt-1" id="time-taken-text">00:00</p>
                    </div>
                    <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100 col-span-2 flex justify-between items-center">
                        <p class="text-sm font-bold text-slate-500 uppercase tracking-widest">Accuracy</p>
                        <p class="text-2xl font-extrabold text-emerald-500" id="accuracy-text">0%</p>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="index.html" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-colors flex items-center justify-center">
                        Return to Dashboard <i class="ph-bold ph-arrow-right ml-2"></i>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <!-- Quiz Engine Logic -->
    <script>
        // ==========================================
        // 📥 PASTE YOUR GENERATED QUESTIONS HERE 📥
        // ==========================================
        const quizData = [
            {
                question: "What is the formula to find the Discriminant (Δ) of a quadratic equation ax² + bx + c = 0?",
                options: ["b² + 4ac", "b² - 4ac", "-b ± √4ac", "a² - 4bc"],
                correctIndex: 1
            },
            {
                question: "If the discriminant Δ is exactly 0, what is the nature of the roots?",
                options: ["Real and Distinct (Unequal)", "Imaginary (No Real Roots)", "Real and Equal (Coincident)", "Rational and Unequal"],
                correctIndex: 2
            },
            {
                question: "Solve by factorisation: x² - 5x + 6 = 0. What are the roots?",
                options: ["x = 2, x = 3", "x = -2, x = -3", "x = 1, x = 6", "x = -1, x = -6"],
                correctIndex: 0
            },
            {
                question: "According to strict ICSE step-marking, what MUST be written after factorising (x-4)(x+1) = 0 before writing the final roots?",
                options: ["The Quadratic Formula", "The discriminant value", "Either (x-4) = 0 OR (x+1) = 0", "Hence proved."],
                correctIndex: 2
            },
            {
                question: "A quadratic equation is given as 2x² - px + 8 = 0. If it has real and equal roots, find the positive value of p.",
                options: ["p = 4", "p = 8", "p = 16", "p = 64"],
                correctIndex: 1
            }
        ];
        // ==========================================
        // ⬆️ END OF QUESTIONS DATA ⬆️
        // ==========================================

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        
        // Timer settings (15 minutes)
        const TOTAL_TIME = 15 * 60;
        let timeRemaining = TOTAL_TIME;
        let timerInterval;

        const questionTracker = document.getElementById('question-tracker');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const progressMap = document.getElementById('progress-map');
        const timerDisplay = document.getElementById('timer-display');

        function initQuiz() {
            buildProgressMap();
            loadQuestion();
            startTimer();
        }

        function buildProgressMap() {
            progressMap.innerHTML = '';
            for (let i = 0; i < quizData.length; i++) {
                const dot = document.createElement('div');
                dot.id = `map-dot-${i}`;
                dot.className = "w-8 h-8 rounded-full border-2 border-slate-200 flex items-center justify-center text-xs font-bold text-slate-400 cursor-pointer hover:bg-slate-100 transition-colors shrink-0";
                dot.innerText = i + 1;
                dot.onclick = () => jumpToQuestion(i);
                progressMap.appendChild(dot);
            }
            updateProgressMap();
        }

        function updateProgressMap() {
            for (let i = 0; i < quizData.length; i++) {
                const dot = document.getElementById(`map-dot-${i}`);
                
                // Reset classes
                dot.className = "w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-bold cursor-pointer transition-colors shrink-0 ";
                
                if (i === currentQuestionIndex) {
                    dot.className += "border-slate-800 bg-slate-800 text-white"; // Current
                } else if (userAnswers[i] !== null) {
                    dot.className += "border-slate-400 bg-slate-200 text-slate-600"; // Answered
                } else {
                    dot.className += "border-slate-200 text-slate-400 hover:bg-slate-100"; // Unanswered
                }
            }
        }

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            
            questionTracker.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            questionText.innerText = q.question;
            
            // Generate Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestionIndex] === index;
                const btnClass = isSelected ? "option-btn option-selected" : "option-btn hover:bg-slate-50";
                const spanClass = isSelected ? "bg-slate-800 text-white" : "bg-slate-100 text-slate-500";
                
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border-2 border-slate-100 bg-white text-slate-700 font-medium flex items-center ${btnClass}`;
                btn.innerHTML = `<span class="h-8 w-8 rounded-lg flex items-center justify-center font-bold mr-4 shrink-0 transition-colors ${spanClass}">${String.fromCharCode(65 + index)}</span> ${opt}`;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });

            // Update Navigation Buttons
            prevBtn.classList.toggle('invisible', currentQuestionIndex === 0);
            
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
                submitBtn.classList.add('flex');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
                submitBtn.classList.remove('flex');
            }

            updateProgressMap();
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            loadQuestion(); // Reload to update UI styles
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 60) {
                    timerDisplay.parentElement.classList.add('timer-warning');
                }
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    autoSubmit();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function confirmExit() {
            if(confirm("Are you sure you want to exit? Your progress will be lost.")) {
                window.location.href = "index.html";
            }
        }

        function autoSubmit() {
            alert("Time's up! Submitting your exam automatically.");
            submitExam(true);
        }

        function submitExam(force = false) {
            const unanswered = userAnswers.filter(a => a === null).length;
            
            if (!force && unanswered > 0) {
                if(!confirm(`You have ${unanswered} unanswered question(s). Are you sure you want to submit?`)) {
                    return;
                }
            }

            clearInterval(timerInterval);
            calculateResults();
        }

        function calculateResults() {
            let score = 0;
            for (let i = 0; i < quizData.length; i++) {
                if (userAnswers[i] === quizData[i].correctIndex) {
                    score++;
                }
            }

            // Hide Quiz, Show Results
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('quiz-header').classList.add('hidden');
            
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.classList.remove('hidden');
            
            // Populate Metrics
            const timeTakenSecs = TOTAL_TIME - timeRemaining;
            const mins = Math.floor(timeTakenSecs / 60);
            const secs = timeTakenSecs % 60;
            
            document.getElementById('final-score-text').innerText = `${score}/${quizData.length}`;
            document.getElementById('time-taken-text').innerText = `${mins}m ${secs}s`;
            
            const accuracy = Math.round((score / quizData.length) * 100);
            const accuracyElem = document.getElementById('accuracy-text');
            accuracyElem.innerText = `${accuracy}%`;
            
            // Color code accuracy
            if (accuracy >= 80) accuracyElem.className = "text-2xl font-extrabold text-emerald-500";
            else if (accuracy >= 50) accuracyElem.className = "text-2xl font-extrabold text-amber-500";
            else accuracyElem.className = "text-2xl font-extrabold text-red-500";
        }

        // Start Quiz on Load
        window.onload = initQuiz;
    </script>
</body>
</html>
